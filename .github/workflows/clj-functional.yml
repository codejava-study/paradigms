name: Clojure Functional Expressions Test 
on: push 

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./clojure
    steps:
      - uses: actions/checkout@v4
      - run: bash ./TestClojure.sh cljtest.functional.FunctionalTest hard "base 3233 3435 3637 3839"

