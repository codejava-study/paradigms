name: JS Exceptions Test 
on: push 

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./javascript
    steps:
      - uses: actions/checkout@v4
      - run: bash ./TestJS.sh jstest.prefix.PrefixTest easy "Base 3233 3435" && bash ./TestJS.sh jstest.prefix.PostfixTest easy "Base 3637 3839"

